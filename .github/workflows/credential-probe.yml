# Rehearsal 7 credential probe (PF-015, AR-033, DEC-R7-007). Runs only on this
# never-merged pull request. It checks the two token scopes without exposing a
# value and without changing any repository: every write probe asks GitHub to
# create a ref pointing at a commit that does not exist, so a token that may
# write gets 422 (rejected object) and a token that may not gets 403 or 404.
# Nothing is ever created. Both data repositories are public, so the read
# checks prove only that each token is valid (a bad token gets 401).
name: credential-probe

on:
  pull_request:
    branches: ["main"]
    paths: [".github/workflows/credential-probe.yml"]

permissions:
  contents: read

concurrency:
  group: credential-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      READ_TOKEN: ${{ secrets.CAUSA_GITHUB_TOKEN }}
      WRITE_TOKEN: ${{ secrets.CAUSA_WRITE_TOKEN }}
    steps:
      - name: Probe token scopes
        shell: bash
        run: |
          set -uo pipefail
          api=https://api.github.com/repos/kemiller2002
          zero=0000000000000000000000000000000000000000
          status() { curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $1" -H "Accept: application/vnd.github+json" "${@:2}"; }
          read_code()  { status "$1" "$api/$2/contents/README.md"; }
          write_code() { status "$1" -H "Content-Type: application/json" -X POST "$api/$2/git/refs" -d "{\"ref\":\"refs/heads/credential-probe-never-created\",\"sha\":\"$zero\"}"; }
          fails=0
          check() { # name actual allowed...
            local name=$1 actual=$2; shift 2
            if [[ " $* " == *" $actual "* ]]; then echo "PASS $name ($actual)"; else echo "FAIL $name ($actual, expected one of: $*)"; fails=$((fails+1)); fi
          }
          for t in READ_TOKEN WRITE_TOKEN; do
            if [ -z "${!t}" ]; then echo "BLOCKED $t is not set as a repository secret"; fails=$((fails+1)); fi
          done
          [ "$fails" -gt 0 ] && exit 1
          check "read token is valid (causa-data)"           "$(read_code  "$READ_TOKEN"  causa-data)"              200
          check "read token cannot write causa-data"       "$(write_code "$READ_TOKEN"  causa-data)"              403 404
          check "read token cannot write causa-write-test" "$(write_code "$READ_TOKEN"  causa-write-test)"        403 404
          check "read token cannot write rehearsal-007"    "$(write_code "$READ_TOKEN"  indy-init-rehearsal-007)" 403 404
          check "write token is valid (causa-write-test)"    "$(read_code  "$WRITE_TOKEN" causa-write-test)"        200
          check "write token may write causa-write-test"   "$(write_code "$WRITE_TOKEN" causa-write-test)"        422
          check "write token cannot write causa-data"      "$(write_code "$WRITE_TOKEN" causa-data)"              403 404
          check "write token cannot write rehearsal-007"   "$(write_code "$WRITE_TOKEN" indy-init-rehearsal-007)" 403 404
          echo "failures=$fails"
          exit $(( fails > 0 ))
